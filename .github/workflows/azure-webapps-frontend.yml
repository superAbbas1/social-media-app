name: Build and deploy Node.js backend + React frontend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Verify backend files
        working-directory: backend
        run: |
          echo "Listing backend directory"
          ls -la
          echo "Showing server.js first 20 lines"
          sed -n '1,20p' server.js

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: social-media-backend-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: backend-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: |
          echo "Build folder listing"
          ls -la frontend/build || true

      - name: Verify frontend publish profile exists and matches app-name
        env:
          PUBLISH_XML: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
        run: |
          if [ -z "$PUBLISH_XML" ]; then
            echo "Frontend publish profile secret AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND is not set";
            exit 1;
          fi
          echo "$PUBLISH_XML" > frontend-publish.xml
          if ! grep -qiE 'msdeploy(site|-site)?="social-media-frontend"|profileName="[^"]*social-media-frontend' frontend-publish.xml; then
            echo "Warning: publish profile does not reference the frontend app name (msdeploySite/profileName). Please ensure the secret contains the publish profile for the frontend app.";
            # fail early to avoid confusing deploy error
            exit 1;
          fi
          echo "Frontend publish profile looks correct.";

      - name: Deploy frontend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: social-media-frontend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: frontend/build
